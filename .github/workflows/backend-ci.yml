name: Backend CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel 13 / PHP 8.4 / MySQL 8
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: landatrip_ci
          MYSQL_USER: landatrip_ci
          MYSQL_PASSWORD: ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=ci-root-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: landatrip_ci
      DB_USERNAME: landatrip_ci
      DB_PASSWORD: ci-only
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      SCOUT_DRIVER: 'null'
      TEST_ENABLED: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, gd, http, intl, mbstring, pdo_mysql, raphf, xml, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify PHP platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction --abandoned=report

      - name: Verify Laravel bootstrapping and route inventory
        run: |
          php artisan --version
          php artisan route:list --json > /tmp/routes.json
          test "$(jq length /tmp/routes.json)" -eq 352
          test "$(jq '[.[] | select(.uri | startswith("api/"))] | length' /tmp/routes.json)" -eq 217
          test "$(jq '[.[] | select(.uri | startswith("api/app/v1"))] | length' /tmp/routes.json)" -eq 49

      - name: Run migrations on MySQL 8
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --class='Database\Seeders\LanguageSeeder' --force

      - name: Run Laravel tests
        run: php artisan test
