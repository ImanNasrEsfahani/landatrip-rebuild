name: ARM64 deployment images
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Normalize registry namespace
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build PHP ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/staging/Dockerfile
          target: php
          platforms: linux/arm64
          push: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/landatrip-rebuild-php:${{ github.sha }}
          build-args: |
            VITE_APP_URL=https://landatrip.ca
            VITE_ASSET_URL=https://landatrip.ca
          cache-from: type=gha,scope=landatrip-arm64
          cache-to: type=gha,mode=max,scope=landatrip-arm64
      - name: Build Nginx ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/staging/Dockerfile
          target: web
          platforms: linux/arm64
          push: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/landatrip-rebuild-web:${{ github.sha }}
          build-args: |
            VITE_APP_URL=https://landatrip.ca
            VITE_ASSET_URL=https://landatrip.ca
          cache-from: type=gha,scope=landatrip-arm64
          cache-to: type=gha,mode=max,scope=landatrip-arm64
      - name: Verify published ARM64 manifests
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for image in php web; do
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/landatrip-rebuild-$image:$GITHUB_SHA"
            docker buildx imagetools inspect --raw "$ref" | jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' >/dev/null
            docker buildx imagetools inspect "$ref" | sed -n '1,4p'
          done
