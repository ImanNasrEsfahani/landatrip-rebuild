name: Chromium E2E CI

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Run isolated MySQL and Chromium suite
        run: bash scripts/e2e-run.sh
      - name: Upload Playwright report, screenshots, and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
