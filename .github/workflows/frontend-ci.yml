name: Frontend CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: React 18 / Vite 7 / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build production client bundles
        run: npm run build

      - name: Verify Vite manifest contracts
        run: npm run verify:manifest

      - name: Build Inertia SSR bundle
        run: npm run build:ssr
