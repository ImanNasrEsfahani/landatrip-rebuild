name: Secret scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern 'gitleaks_8.30.1_linux_x64.tar.gz' \
            --pattern 'gitleaks_8.30.1_checksums.txt' --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' \
            gitleaks_8.30.1_checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      # The known tracked credential is removed in the follow-up PR after
      # owner revocation. Scan every new file version without exceptions now.
      - name: Scan every changed file
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_CONFIG_TOML: |
            [extend]
            useDefault = true
        run: |
          while IFS= read -r -d '' path; do
            "$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner "$path"
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA"...HEAD)
