services:
  local-edge:
    image: caddy:2.10-alpine
    ports:
      - '127.0.0.1:8443:8443'
    environment:
      NO_PROXY: web,app,mysql,localhost,127.0.0.1
      no_proxy: web,app,mysql,localhost,127.0.0.1
      STAGING_ACCESS_USER: ${STAGING_ACCESS_USER:?Set STAGING_ACCESS_USER}
      STAGING_ACCESS_PASSWORD_HASH: ${STAGING_ACCESS_PASSWORD_HASH:?Set STAGING_ACCESS_PASSWORD_HASH}
    volumes:
      - ./docker/staging/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - staging_caddy_data:/data
      - staging_caddy_config:/config
    depends_on:
      web: { condition: service_started }
    networks: [internal, public]
    restart: unless-stopped
    mem_limit: 128m
